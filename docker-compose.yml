services:
  arrse:
    image: ${ARRSE_IMAGE:-ghcr.io/sampotts/arrse:latest}
    pull_policy: always
    container_name: arrse
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      INPUT_PATHS: ${INPUT_PATHS:-["/input"]}
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${INPUT_PATH:?set INPUT_PATH}:/input
      - ${CONFIG_PATH:-./config}:/config
      - ${CACHE_PATH:-./cache}:/cache
    stop_grace_period: 30m
