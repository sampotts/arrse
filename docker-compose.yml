services:
  arrse:
    image: ${ARRSE_IMAGE:-ghcr.io/sampotts/arrse:latest}
    pull_policy: always
    container_name: arrse
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MEDIA_PATHS: ${MEDIA_PATHS:?set MEDIA_PATHS to a JSON array of container paths}
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${MEDIA_PATH:?set MEDIA_PATH}:${MEDIA_CONTAINER_PATH:?set MEDIA_CONTAINER_PATH}
      - ${CONFIG_PATH:-./config}:/config
      - ${CACHE_PATH:-./cache}:/cache
    stop_grace_period: 30m
